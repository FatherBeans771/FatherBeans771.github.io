<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toilet Village</title>
<style>
:root{--bg:#eaf6ff;--fg:#14304a;--card:#fff;--line:#b9d8ee;--accent:#2a8fd6;--field:#cfeeff;--btn:#fff7d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c28;--fg:#e6f2fb;--card:#17283a;--line:#2b4660;--accent:#5bb6f0;--field:#173246;--btn:#2d3a22}}
:root[data-theme="dark"]{--bg:#0f1c28;--fg:#e6f2fb;--card:#17283a;--line:#2b4660;--accent:#5bb6f0;--field:#173246;--btn:#2d3a22}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:12px}
.wrap{max-width:900px;margin:0 auto;display:grid;gap:12px}
h1{margin:0;font-size:22px}
.bar{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px}
.stat{font-weight:700;font-size:18px}
.stat small{font-weight:400;opacity:.75;font-size:13px}
canvas{width:100%;height:auto;display:block;background:var(--field);border:2px solid var(--line);border-radius:14px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px}
.card h2{margin:0 0 8px;font-size:16px}
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
button{font:inherit;color:var(--fg);background:var(--btn);border:2px solid var(--line);border-radius:10px;padding:8px;text-align:left;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
button{touch-action:manipulation}
button:not(:disabled):hover{border-color:var(--accent)}
button b{display:block}
button span{font-size:12px;opacity:.8}
#village{min-height:90px;display:flex;flex-wrap:wrap;gap:2px;font-size:26px;line-height:1.1}
#village i{font-style:normal;display:inline-block;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.hint{font-size:13px;opacity:.8}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal[hidden]{display:none}
.sheet{width:100%;max-width:700px;max-height:85vh;overflow:auto}
.sheet .bar{margin-bottom:10px;align-items:center}
.sheet h2{margin:0}
.openbtn{font-weight:700;text-align:center;background:var(--accent);color:#fff;border-color:var(--accent);padding:8px 16px}
.right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
canvas.vill{background:#bfe8b0}
@media (prefers-color-scheme:dark){canvas.vill{background:#26402c}}
:root[data-theme="dark"] canvas.vill{background:#26402c}
:root[data-theme="light"] canvas.vill{background:#bfe8b0}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);background:#b3261e;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;z-index:30;max-width:90vw;text-align:center}
#toast[hidden]{display:none}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{text-align:center;font-weight:700}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <h1>🚽 Toilet Village</h1>
    <div class="right"><div class="stat">🪙 <span id="coins">0</span> <small>(+<span id="rate">0</span>/sec)</small></div><button class="openbtn" id="pauseBtn">⏸ Pause</button><button class="openbtn" id="modeBtn">🏘️ Village</button><button class="openbtn" id="openShop">🛒 Shop</button></div>
  </div>
  <canvas id="c" width="640" height="340"></canvas>
  <div class="hint" id="hint">Move with arrow keys / WASD, or drag on the field. Grab coins, then tap the Shop button to spend them (or press B).</div>
  <div id="toast" hidden></div><div class="modal" id="modal" hidden><div class="card sheet"><div class="bar"><h2>🛒 Shop</h2><div class="right"><div class="stat">🪙 <span id="coins2">0</span></div><button id="closeShop">✕ Close</button></div></div><div class="tabs"><button data-t="town" class="on">🏘️ Village</button><button data-t="fight">🔫 Fight</button><button data-t="wear">👗 Costumes</button></div><div class="shop" id="shop"></div></div></div>
  <div class="card"><h2>Your village (<span id="pop">0</span> toilet people)</h2><div id="village"></div></div>
</div>
<script>
const ITEMS=[
 {id:'person',emoji:'🚽',name:'Toilet Person',base:10,inc:0.2,pop:1},
 {id:'hut',emoji:'🛖',name:'Porcelain Hut',base:40,inc:1,pop:0},
 {id:'plunger',emoji:'🪠',name:'Plunger Tower',base:120,inc:3,pop:0},
 {id:'fountain',emoji:'⛲',name:'Bidet Fountain',base:350,inc:9,pop:0},
 {id:'castle',emoji:'🏰',name:'Toilet Castle',base:1000,inc:28,pop:0}
];
let S={coins:0,own:{},magnet:0};
try{const r=localStorage.getItem('toiletVillage');if(r){const p=JSON.parse(r);if(p&&typeof p==='object')S=Object.assign(S,p)}}catch(e){}
S.own=S.own&&typeof S.own==='object'?S.own:{};S.hearts=S.hearts&&typeof S.hearts==='object'?S.hearts:{};
['coins','earned','magnet','gun','hpLv','rateLv','multi','kills','evilCount'].forEach(k=>{if(S[k]!=null)S[k]=Number.isFinite(+S[k])&&+S[k]>=0?+S[k]:0});
S.multi=Math.min(S.multi||0,2);S.rateLv=Math.min(S.rateLv||0,7);S.hpLv=Math.min(S.hpLv||0,20);
ITEMS.forEach(it=>{S.own[it.id]=Math.max(0,Math.floor(+S.own[it.id]||0))});
if(S.earned==null)S.earned=S.coins||0;
if(!(S.nextEvil>0)||S.nextEvil%10000)S.nextEvil=(Math.floor(S.earned/10000)+1)*10000;
S.evilCount=S.evilCount||0;S.kills=S.kills||0;S.gun=S.gun||0;
S.owned=S.owned||{};S.wear=S.wear||null;S.hpLv=S.hpLv||0;S.rateLv=S.rateLv||0;S.multi=S.multi||0;
const cost=it=>Math.ceil(it.base*Math.pow(1.15,S.own[it.id]||0));
const magCost=()=>Math.ceil(30*Math.pow(1.8,S.magnet));

const rate=()=>ITEMS.reduce((a,it)=>a+it.inc*(S.own[it.id]||0),0);

const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=640,H=340,DPR=Math.min(window.devicePixelRatio||1,2);
cv.width=W*DPR;cv.height=H*DPR;
const P={x:W/2,y:H/2,vx:0,vy:0};
let coins=[],pops=[],keys={},target=null,spawnT=0,frac=0,last=performance.now();
let mode='field',res=[],chase=null,say=null;
let bagT=10,safeT=30,safeUp=false;spawnT=5;
let evils=[],shots=[],hp=100+25*(S.hpLv||0),fireT=0,paused=false;

addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.startsWith('Arrow')||(e.key===' '&&modal.hidden))e.preventDefault()});
addEventListener('blur',()=>{keys={}});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
function setTarget(e){const r=cv.getBoundingClientRect();target={x:(e.clientX-r.left-cv.clientLeft)*W/cv.clientWidth,y:(e.clientY-r.top-cv.clientTop)*H/cv.clientHeight}}
cv.addEventListener('pointerdown',e=>{if(paused)return;cv.setPointerCapture(e.pointerId);setTarget(e);
  if(mode==='village'){const ev=evils.find(e=>Math.hypot(e.x-target.x,e.y-target.y)<40);if(ev){shoot(ev.x,ev.y);target=null;chase=null;return}const h=res.find(r=>Math.hypot(r.x-target.x,r.y-target.y)<30);if(h){chase=h;target=null}else chase=null}});
cv.addEventListener('pointermove',e=>{if(target)setTarget(e)});
cv.addEventListener('pointerup',()=>{target=null});
cv.addEventListener('pointercancel',()=>{target=null});

function spawn(kind){
  const safe=kind==='safe',gold=kind===true;
  if(!safe&&coins.length>=25)return;
  if(safe)safeUp=true;
  coins.push({x:40+Math.random()*(W-80),y:40+Math.random()*(H-80),v:safe?15:gold?5:1,gold,safe,t:0});
}
spawn(false);spawn(false);spawn(true);spawn('safe');
function pop(x,y,txt){pops.push({x,y,txt,t:0})}

function update(dt){
  const sp=230+0; let ax=0,ay=0;
  if(keys.arrowleft||keys.a)ax-=1; if(keys.arrowright||keys.d)ax+=1;
  if(keys.arrowup||keys.w)ay-=1; if(keys.arrowdown||keys.s)ay+=1;
  let tg=target;
  if(mode==='village'&&chase){if(Math.hypot(chase.x-P.x,chase.y-P.y)<45){talk(chase);chase=null;tg=null}else tg={x:chase.x,y:chase.y}}
  if(tg){const dx=tg.x-P.x,dy=tg.y-P.y,d=Math.hypot(dx,dy);if(d>6){ax=dx/d;ay=dy/d}}
  const l=Math.hypot(ax,ay)||1;
  P.x+=ax/l*(ax||ay?sp:0)*dt; P.y+=ay/l*(ax||ay?sp:0)*dt;
  P.x=Math.max(20,Math.min(W-20,P.x)); P.y=Math.max(20,Math.min(H-20,P.y));
  if(S.earned>=S.nextEvil){S.nextEvil+=10000;S.evilCount++;toast('😈 An evil toilet invaded your village! Go fight it!')}
  spawnT-=dt;bagT-=dt;
  if(spawnT<=0){spawn(false);spawnT=5}
  if(bagT<=0){spawn(true);bagT=10}
  if(!safeUp){safeT-=dt;if(safeT<=0)spawn('safe')}
  if(mode!=='field'){wander(dt);fight(dt)}
  const reach=26+S.magnet*14;
  if(mode==='field')coins=coins.filter(c=>{
    c.t+=dt;
    const d=Math.hypot(c.x-P.x,c.y-P.y);
    if(S.magnet&&d<reach*2.2){c.x+=(P.x-c.x)*dt*3;c.y+=(P.y-c.y)*dt*3}
    if(d<reach){S.coins+=c.v;S.earned+=c.v;burst(c.x,c.y,c.safe||c.gold?'#ffd21f':'#ffe680',c.safe?18:8);pop(c.x,c.y,'+'+c.v);if(c.safe){safeUp=false;safeT=30}return false}
    return true;
  });
  frac+=rate()*dt; if(frac>=1){const w=Math.floor(frac);S.coins+=w;S.earned+=w;frac-=w}
  pops.forEach(p=>p.t+=dt); pops=pops.filter(p=>p.t<0.8);
  sparks.forEach(p=>{p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=160*dt});sparks=sparks.filter(p=>p.t<0.5);aT+=dt;
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);drawBackground();
  ctx.textAlign='center';ctx.textBaseline='middle';
  if(mode==='village'){drawVillage();return}
  coins.forEach(c=>{
    const b=Math.sin(c.t*5)*3;shadow(c.x,c.y+(c.safe?22:15),c.safe?22:c.gold?11:8);
    if(c.safe){ctx.fillStyle='#5b6670';ctx.fillRect(c.x-22,c.y-20+b,44,40);ctx.fillStyle='#8d99a3';ctx.fillRect(c.x-18,c.y-16+b,36,32);ctx.fillStyle='#f2c230';ctx.beginPath();ctx.arc(c.x,c.y+b,10,0,7);ctx.fill();ctx.fillStyle='#222';ctx.font='bold 12px sans-serif';ctx.fillText('15',c.x,c.y+b+1);return}
    ctx.font=(c.gold?32:24)+'px sans-serif';
    ctx.fillText(c.gold?'💰':'🪙',c.x,c.y+b);
  });
  drawSparks();
  if(S.magnet){ctx.strokeStyle='rgba(42,143,214,.35)';ctx.setLineDash([5,5]);ctx.beginPath();ctx.arc(P.x,P.y,26+S.magnet*14,0,7);ctx.stroke();ctx.setLineDash([])}
  ctx.font='40px sans-serif';
  const bob=isMoving()?Math.abs(Math.sin(aT*11))*5:0;shadow(P.x,P.y+19,16);ctx.save();ctx.translate(P.x,P.y-bob);ctx.rotate(Math.sin(aT*11)*0.035*(isMoving()?1:0));drawToilet(0,0,1.05,{me:1});ctx.restore();
  ctx.font='bold 18px sans-serif';ctx.fillStyle='#e8a800';
  pops.forEach(p=>{ctx.globalAlpha=1-p.t/0.8;ctx.fillText(p.txt,p.x,p.y-20-p.t*40)});
  ctx.globalAlpha=1;
}
let aT=0,sparks=[];
const isMoving=()=>!!(keys.a||keys.d||keys.w||keys.s||keys.arrowleft||keys.arrowright||keys.arrowup||keys.arrowdown||target||(mode==='village'&&chase));
function shadow(x,y,r){ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(x,y,r,r*.32,0,0,6.3);ctx.fill()}
function burst(x,y,col,n){n=n||8;for(let i=0;i<n;i++){const a=Math.random()*6.28,s=40+Math.random()*80;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,t:0,c:col})}}
function drawSparks(){sparks.forEach(p=>{ctx.globalAlpha=Math.max(0,1-p.t/0.5);ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,4,4)});ctx.globalAlpha=1}
function theme(){const n=performance.now();if(n-fgT>500){fgT=n;fgC=(getComputedStyle(document.documentElement).getPropertyValue('--fg')||'#14304a').trim()}return fgC}
const BG=(()=>{let sd=777;const r=()=>{sd=sd+0x6D2B79F5|0;let t=Math.imul(sd^sd>>>15,1|sd);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const E=['🌼','🌸','🌷','🌻','🌿','🍀'],fl=[],cl=[],st=[],bf=[],bd=[],ff=[];
  for(let i=0;i<46;i++)fl.push({x:10+r()*(W-20),y:64+r()*(H-84),e:E[Math.floor(r()*E.length)],p:r()*6.28,s:11+r()*6});
  for(let i=0;i<5;i++)cl.push({x:r()*(W+160),y:8+r()*28,s:.7+r()*.8,v:6+r()*8});
  for(let i=0;i<40;i++)st.push({x:r()*W,y:r()*60,p:r()*6.28});
  for(let i=0;i<4;i++)bf.push({cx:60+r()*(W-120),cy:90+r()*(H-140),ax:30+r()*60,ay:20+r()*40,f:.3+r()*.4,p:r()*6.28,e:i%2?'🦋':'🐝'});
  for(let i=0;i<3;i++)bd.push({y:25+r()*70,v:25+r()*20,x:r()*W,p:r()*6});
  for(let i=0;i<22;i++)ff.push({cx:r()*W,cy:70+r()*(H-90),a:10+r()*25,f:.3+r()*.5,p:r()*6.28});
  return{fl,cl,st,bf,bd,ff}})();
function drawBackground(){
  const dark=theme().toLowerCase()==='#e6f2fb',v=mode==='village',HZ=56;
  ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';
  const g=ctx.createLinearGradient(0,0,0,H);
  if(dark){g.addColorStop(0,'#0d1b3a');g.addColorStop(HZ/H,'#1c3a5a');g.addColorStop(HZ/H+.001,'#1f3d2a');g.addColorStop(1,'#16301f')}
  else{g.addColorStop(0,'#8fd3ff');g.addColorStop(HZ/H,'#d6f1ff');g.addColorStop(HZ/H+.001,v?'#bde8a4':'#aee593');g.addColorStop(1,v?'#8fd37a':'#7fcb6e')}
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=dark?'rgba(255,255,255,.03)':'rgba(255,255,255,.13)';
  for(let x=0;x<W;x+=80)ctx.fillRect(x,HZ,40,H-HZ);
  const ell=(x,y,rx,ry)=>{ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,6.3);ctx.fill()};
  if(dark){
    BG.st.forEach(s=>{ctx.fillStyle='rgba(255,255,255,'+(.35+.4*Math.sin(aT*2+s.p))+')';ctx.fillRect(s.x,s.y,2,2)});
    ctx.fillStyle='#f4f1d0';ell(W-70,26,12,12);ctx.fillStyle='#14284a';ell(W-65,23,10,10);
  }else{
    const sx=W-70,sy=26,pu=2*Math.sin(aT*2);
    ctx.fillStyle='rgba(255,236,120,.28)';ell(sx,sy,24+pu,24+pu);
    ctx.strokeStyle='rgba(255,220,80,.8)';ctx.lineWidth=2;
    for(let i=0;i<8;i++){const a=i*Math.PI/4+aT*.3;ctx.beginPath();ctx.moveTo(sx+Math.cos(a)*18,sy+Math.sin(a)*18);ctx.lineTo(sx+Math.cos(a)*25,sy+Math.sin(a)*25);ctx.stroke()}
    ctx.fillStyle='#ffd93b';ell(sx,sy,14,14);
  }
  ctx.fillStyle=dark?'#3b4f6d':'#fff';
  BG.cl.forEach(c=>{const x=((c.x+c.v*aT)%(W+160))-80,s=c.s*.8;ell(x,c.y,24*s,8*s);ell(x+14*s,c.y+2*s,18*s,7*s);ell(x-14*s,c.y+3*s,16*s,6*s)});
  if(!dark){ctx.strokeStyle='#2b3f55';ctx.lineWidth=1.6;BG.bd.forEach(b=>{const x=((b.x+b.v*aT)%(W+60))-30,y=b.y*.45+Math.sin(aT*2+b.p)*3,f=Math.sin(aT*9+b.p)*3;ctx.beginPath();ctx.moveTo(x-6,y-f);ctx.lineTo(x,y+1);ctx.lineTo(x+6,y-f);ctx.stroke()})}
  if(v){
    for(let i=0;i<11;i++){ctx.save();ctx.translate(18+i*62+(i%2)*10,HZ+8);ctx.rotate(Math.sin(aT*1.2+i)*.03);ctx.font='34px sans-serif';ctx.fillText(i%3===1?'🌲':'🌳',0,0);ctx.restore()}
    ctx.strokeStyle=dark?'#5b4a36':'#d9bd8a';ctx.lineWidth=26;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(-10,H-60);ctx.bezierCurveTo(160,H-120,260,H-20,380,H-90);ctx.bezierCurveTo(470,H-140,560,H-60,W+10,H-110);ctx.stroke();
    ctx.strokeStyle=dark?'#6b583f':'#e8d3a6';ctx.lineWidth=18;ctx.stroke();
    const px=W-100,py=112;
    ctx.fillStyle=dark?'#1d4a68':'#6cc0ec';ell(px,py,48,17);ctx.fillStyle=dark?'#27608a':'#8fd5f5';ell(px-6,py-3,34,10);
    ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=1;
    for(let i=0;i<2;i++){const k=(aT*.6+i*.5)%1;ctx.globalAlpha=1-k;ctx.beginPath();ctx.ellipse(px+14,py+2,6+k*20,2+k*6,0,0,6.3);ctx.stroke()}
    ctx.globalAlpha=1;ctx.font='20px sans-serif';ctx.fillText('🦆',px+Math.sin(aT*.5)*24,py-2+Math.sin(aT*.9)*3);
  }
  BG.fl.slice(0,v?28:46).forEach(f=>{ctx.save();ctx.translate(f.x,f.y);ctx.rotate(Math.sin(aT*1.6+f.p)*.18);ctx.font=f.s+'px sans-serif';ctx.globalAlpha=dark?.6:1;ctx.fillText(f.e,0,0);ctx.restore()});
  if(dark){BG.ff.forEach(f=>{const x=f.cx+Math.sin(aT*f.f+f.p)*f.a,y=f.cy+Math.cos(aT*f.f*1.3+f.p)*f.a*.6,a=.5+.5*Math.sin(aT*3+f.p);ctx.fillStyle='rgba(255,240,120,'+a*.25+')';ell(x,y,5,5);ctx.fillStyle='rgba(255,250,170,'+a+')';ell(x,y,1.8,1.8)})}
  else BG.bf.forEach(b=>{const x=b.cx+Math.sin(aT*b.f+b.p)*b.ax,y=b.cy+Math.sin(aT*b.f*1.7+b.p)*b.ay;ctx.save();ctx.translate(x,y);ctx.scale(.45+.55*Math.abs(Math.sin(aT*10+b.p)),1);ctx.font='16px sans-serif';ctx.fillText(b.e,0,0);ctx.restore()});
  ctx.restore();
}
const NAMES=['Sir Flushalot','Bowl Gates','Dame Porcelain','Wally Wobble','Pip Plunger','Lady Lavatory','Tank Top','Seat Sam','Loo Skywalker','Flushy McFlush','Commode Carl','Bidet Betty','Duke of Drain','Princess Pipe','Rusty Rim','Gurgle Greg'];
const LINES=['Welcome to the village, boss!','The coins are flowing nicely.','I love my porcelain hut!','Have you seen the fountain?','Flush with excitement today!','Careful, the plunger tower leans.','Nice seat you have there.','Business is booming!','I dreamed of a bigger castle.','Everything is going swimmingly.','Plumbing is my passion.','You are the best coin collector!'];
const nameOf=i=>NAMES[i%NAMES.length]+(i>=NAMES.length?' '+(Math.floor(i/NAMES.length)+1):'');
function syncRes(){const n=Math.min(S.own.person||0,30);while(res.length<n){const i=res.length;res.push({i,name:nameOf(i),x:30+Math.random()*(W-60),y:130+Math.random()*(H-160),tx:0,ty:0,w:Math.random()*2,cool:0})}}
function wander(dt){syncRes();
  res.forEach(r=>{r.cool=Math.max(0,r.cool-dt);if(r.w>0){r.w-=dt;return}
    if(!r.tx){r.tx=r.x;r.ty=r.y}
    const dx=r.tx-r.x,dy=r.ty-r.y,d=Math.hypot(dx,dy);
    if(d<3){r.w=1+Math.random()*3;r.tx=25+Math.random()*(W-50);r.ty=125+Math.random()*(H-150)}else{r.x+=dx/d*32*dt;r.y+=dy/d*32*dt}});
  if(say){say.t-=dt;if(say.t<=0)say=null}}
function talk(r){
  let h=S.hearts[r.i]||0;
  let txt=LINES[Math.floor(Math.random()*LINES.length)];

let fgT=0,fgC='#14304a';
let toastTm;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toastTm);toastTm=setTimeout(()=>{t.hidden=true},3500)}
function spawnEvil(){const m=40+15*S.kills;evils.push({x:P.x<W/2?W-30:30,y:130,hp:m,max:m,hit:0})}
function nearestEvil(){let b=null,bd=1e9;evils.forEach(e=>{const d=Math.hypot(e.x-P.x,e.y-P.y);if(d<bd){bd=d;b=e}});return b}
function shoot(tx,ty){if(fireT>0)return;const b=Math.atan2(ty-P.y,tx-P.x),n=1+S.multi;for(let i=0;i<n;i++){const a=b+(i-(n-1)/2)*0.22;shots.push({x:P.x,y:P.y,vx:Math.cos(a)*420,vy:Math.sin(a)*420,t:0,r:a})}fireT=rateT(S.rateLv)}
function fight(dt){
  fireT=Math.max(0,fireT-dt);
  while(evils.length<Math.min(S.evilCount,3))spawnEvil();
  if(keys.f){const e=nearestEvil();if(e)shoot(e.x,e.y)}
  evils.forEach(e=>{e.hit=Math.max(0,e.hit-dt);const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1,sp=38+S.kills*3;e.x+=dx/d*sp*dt;e.y+=dy/d*sp*dt;if(d<34)hp-=22*dt});
  shots.forEach(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt;s.t+=dt;for(const e of evils){if(e.hp>0&&Math.hypot(e.x-s.x,e.y-s.y)<26){e.hp-=6+3*S.gun;e.hit=0.15;s.t=9;break}}});
  shots=shots.filter(s=>s.t<2&&s.x>-20&&s.x<W+20&&s.y>-20&&s.y<H+20);
  evils=evils.filter(e=>{if(e.hp>0)return true;S.evilCount--;S.kills++;const r=200+50*S.kills;S.coins+=r;pop(e.x,e.y,'+'+r);toast('🪠 Evil toilet flushed! +'+r+' coins');return false});
  if(hp<=0){const loss=Math.floor(S.coins*0.1);S.coins-=loss;hp=maxHp();P.x=W/2;P.y=H-40;toast('💦 You got flushed! Lost '+loss+' coins');evils.forEach(e=>{e.x=Math.random()<.5?30:W-30;e.y=130})}
  else if(!evils.length)hp=Math.min(maxHp(),hp+10*dt);
}
const COSTUMES=[
 {id:'bow',emoji:'🎀',name:'Bow',cost:60,dy:-22,size:22},
 {id:'cap',emoji:'🧢',name:'Baseball Cap',cost:120,dy:-24,size:24},

const SLOTS=(()=>{let sd=20260617;const rnd=()=>{sd=sd+0x6D2B79F5|0;let t=Math.imul(sd^sd>>>15,1|sd);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const out=[];let md=56;
  for(let tries=0;out.length<40&&tries<6000;tries++){
    const x=30+rnd()*(W-60),y=76+rnd()*(H-130);
    if(out.every(s=>Math.hypot(s.x-x,s.y-y)>md))out.push({x,y});
    if(tries%400===399&&md>30)md-=4;
  }
  return out})();

 {k:'multi',name:'Multi-Shot',emoji:'🪠',desc:l=>(1+l)+' → '+(2+l)+' plungers per shot',cost:l=>Math.ceil(300*Math.pow(2.5,l)),max:2},
 {k:'hpLv',name:'Max Health',emoji:'❤️',desc:l=>(100+25*l)+' → '+(125+25*l)+' HP',cost:l=>Math.ceil(50*Math.pow(1.6,l)),max:20}

function rrect(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);ctx.fill();ctx.stroke()}
function poly(pts,fill,stroke){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke()}}
function dome(rx,top,fill,stroke){ctx.fillStyle=fill;ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-rx,-19);ctx.quadraticCurveTo(-rx,top,0,top);ctx.quadraticCurveTo(rx,top,rx,-19);ctx.closePath();ctx.fill();ctx.stroke()}
const CD={
 bow(){poly([[0,-22],[-10,-28],[-10,-17]],'#ff5d9e','#a3265f');poly([[0,-22],[10,-28],[10,-17]],'#ff5d9e','#a3265f');ctx.fillStyle='#d6336c';ctx.beginPath();ctx.arc(0,-22,3,0,6.3);ctx.fill()},

 grad(){ctx.fillStyle='#333';ctx.fillRect(-8,-22,16,7);poly([[-16,-24],[0,-31],[16,-24],[0,-18]],'#222','#000');ctx.strokeStyle='#f2c230';ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(0,-24.5);ctx.lineTo(14,-24);ctx.lineTo(14,-16);ctx.stroke();ctx.fillStyle='#f2c230';ctx.beginPath();ctx.arc(14,-15,2,0,6.3);ctx.fill()},

};
function drawToilet(x,y,s,o){o=o||{};
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.globalAlpha=1;ctx.lineJoin='round';ctx.lineWidth=2;
  const body=o.evil?'#f3d6d6':o.me?'#ffffff':['#ffffff','#fff3d1','#dff3ff','#ffe1ee','#e4ffdc'][(o.c||0)%5];

  ctx.fillStyle=o.evil?'#b58a8a':'#bcd6ea';ctx.beginPath();ctx.ellipse(0,3,11,5.5,0,0,6.3);ctx.fill();

function nearest(){let b=null,bd=60;res.forEach(r=>{const d=Math.hypot(r.x-P.x,r.y-P.y);if(d<bd){bd=d;b=r}});return b}
