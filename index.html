<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toilet Village</title>
<style>
:root{--bg:#eaf6ff;--fg:#14304a;--card:#fff;--line:#b9d8ee;--accent:#2a8fd6;--field:#cfeeff;--btn:#fff7d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c28;--fg:#e6f2fb;--card:#17283a;--line:#2b4660;--accent:#5bb6f0;--field:#173246;--btn:#2d3a22}}
:root[data-theme="dark"]{--bg:#0f1c28;--fg:#e6f2fb;--card:#17283a;--line:#2b4660;--accent:#5bb6f0;--field:#173246;--btn:#2d3a22}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:12px}
.wrap{max-width:900px;margin:0 auto;display:grid;gap:12px}
h1{margin:0;font-size:22px}
.bar{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px}
.stat{font-weight:700;font-size:18px}
.stat small{font-weight:400;opacity:.75;font-size:13px}
canvas{width:100%;height:auto;display:block;background:var(--field);border:2px solid var(--line);border-radius:14px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px}
.card h2{margin:0 0 8px;font-size:16px}
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
button{font:inherit;color:var(--fg);background:var(--btn);border:2px solid var(--line);border-radius:10px;padding:8px;text-align:left;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
button{touch-action:manipulation}
button:not(:disabled):hover{border-color:var(--accent)}
button b{display:block}
button span{font-size:12px;opacity:.8}
#village{min-height:90px;display:flex;flex-wrap:wrap;gap:2px;font-size:26px;line-height:1.1}
#village i{font-style:normal;display:inline-block;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.hint{font-size:13px;opacity:.8}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal[hidden]{display:none}
.sheet{width:100%;max-width:700px;max-height:85vh;overflow:auto}
.sheet .bar{margin-bottom:10px;align-items:center}
.sheet h2{margin:0}
.openbtn{font-weight:700;text-align:center;background:var(--accent);color:#fff;border-color:var(--accent);padding:8px 16px}
.right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){#village i,.frenzy.on{animation:none}}
.brand{position:fixed;left:calc(env(safe-area-inset-left,0px) + 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 8px);font-size:12px;font-weight:700;letter-spacing:.3px;color:var(--fg);opacity:.65;pointer-events:none;z-index:5}
.wrap{padding-bottom:26px}
.hud{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.frenzy{font-size:14px;font-weight:600;padding:6px 12px;border-radius:10px;background:var(--card);border:2px solid var(--line);text-align:center}
.frenzy.on{background:#ffcf33;color:#4a2f00;border-color:#e09a00;animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.02)}}
.lb{grid-column:1/-1;display:grid;gap:8px}
.lbtabs{display:flex;gap:6px;flex-wrap:wrap}
.lbtabs button{text-align:center;font-weight:700}
.lbtabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.lbnick{font-size:13px}
.lbnick input{font:inherit;color:var(--fg);background:var(--card);border:2px solid var(--line);border-radius:8px;padding:4px 8px;width:190px;max-width:100%}
.lbrow{display:flex;gap:8px;padding:6px 10px;border:2px solid var(--line);border-radius:10px;background:var(--card)}
.lbrow.me{border-color:var(--accent);background:var(--btn)}
.pill{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--accent);color:#fff;white-space:nowrap;align-self:center}
.lbrow .r{width:34px;font-weight:700}
.lbrow .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbrow .v{font-weight:700;font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);background:#b3261e;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;z-index:30;max-width:90vw;text-align:center}
#toast[hidden]{display:none}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{text-align:center;font-weight:700}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <h1>🚽 Toilet Village</h1>
    <div class="right"><div class="stat">🪙 <span id="coins">0</span> <small>(+<span id="rate">0</span>/sec)</small></div><button class="openbtn" id="pauseBtn">⏸ Pause</button><button class="openbtn" id="modeBtn">🏘️ Village</button><button class="openbtn" id="openShop">🛒 Shop</button><button class="openbtn" id="boardBtn">🏆 Leaderboard</button></div>
  </div>
  <div class="hud"><div class="frenzy" id="frenzy">⏳ Next frenzy in: 15:00</div><div class="frenzy" id="daynight">☀️ Day</div></div>
  <canvas id="c" width="640" height="340"></canvas>
  <div class="hint" id="hint">Move with arrow keys / WASD, or drag on the field. Grab coins, then tap the Shop button to spend them (or press B).</div>
  <div class="brand">claudeAI</div><div id="toast" hidden></div><div class="modal" id="modal" hidden><div class="card sheet"><div class="bar"><h2 id="mtitle">🛒 Shop</h2><div class="right"><div class="stat">🪙 <span id="coins2">0</span></div><button id="closeShop">✕ Close</button></div></div><div class="tabs"><button data-t="town" class="on">🏘️ Village</button><button data-t="fight">🔫 Fight</button><button data-t="wear">👗 Costumes</button><button data-t="unlock">🔓 Unlocks</button><button data-t="board">🏆 Board</button></div><div class="shop" id="shop"></div></div></div>
  <div class="card"><h2>Your village (<span id="pop">0</span> toilet people)</h2><div id="village"></div></div>
</div>
<script>
const ITEMS=[
 {id:'person',emoji:'🚽',name:'Toilet Person',base:10,inc:0.2,pop:1},
 {id:'hut',emoji:'🛖',name:'Porcelain Hut',base:40,inc:1,pop:0},
 {id:'plunger',emoji:'🪠',name:'Plunger Tower',base:120,inc:3,pop:0},
 {id:'fountain',emoji:'⛲',name:'Bidet Fountain',base:350,inc:9,pop:0},
 {id:'castle',emoji:'🏰',name:'Toilet Castle',base:1000,inc:28,pop:0}
];
let S={coins:0,own:{},magnet:0};
try{const r=localStorage.getItem('toiletVillage');if(r){const p=JSON.parse(r);if(p&&typeof p==='object')S=Object.assign(S,p)}}catch(e){}
S.own=S.own&&typeof S.own==='object'?S.own:{};S.hearts=S.hearts&&typeof S.hearts==='object'?S.hearts:{};
['coins','earned','magnet','gun','hpLv','rateLv','multi','kills','evilCount'].forEach(k=>{if(S[k]!=null)S[k]=Number.isFinite(+S[k])&&+S[k]>=0?+S[k]:0});
S.multi=Math.min(S.multi||0,2);S.rateLv=Math.min(S.rateLv||0,7);S.hpLv=Math.min(S.hpLv||0,20);
ITEMS.forEach(it=>{S.own[it.id]=Math.max(0,Math.floor(+S.own[it.id]||0))});
S.nick=typeof S.nick==='string'?S.nick.slice(0,16):'';
S.unl=S.unl&&typeof S.unl==='object'?S.unl:{};S.island=Math.min(5,Math.max(0,Math.floor(+S.island||0)));
if(!(S.dayT>0&&S.dayT<=300))S.dayT=300;S.night=!!S.night;
if(!(S.frenzyT>0&&S.frenzyT<=900))S.frenzyT=900;
S.frenzyLeft=S.frenzyLeft>0&&S.frenzyLeft<=30?S.frenzyLeft:0;
if(S.earned==null)S.earned=S.coins||0;
if(!(S.nextEvil>0)||S.nextEvil%10000)S.nextEvil=(Math.floor(S.earned/10000)+1)*10000;
S.evilCount=S.evilCount||0;S.kills=S.kills||0;S.gun=S.gun||0;
S.owned=S.owned||{};S.wear=S.wear||null;S.hpLv=S.hpLv||0;S.rateLv=S.rateLv||0;S.multi=S.multi||0;
const cost=it=>Math.ceil(it.base*Math.pow(1.15,S.own[it.id]||0));
const magCost=()=>Math.ceil(30*Math.pow(1.8,S.magnet));

const rate=()=>ITEMS.reduce((a,it)=>a+it.inc*(S.own[it.id]||0),0);

const cv=document.getElementById('c'),mainCtx=cv.getContext('2d'),W=640,H=340,DPR=Math.min(window.devicePixelRatio||1,2);
let ctx=mainCtx;
cv.width=W*DPR;cv.height=H*DPR;
const P={x:W/2,y:H/2};
let coins=[],pops=[],keys={},target=null,spawnT=0,frac=0,last=performance.now();
let mode='field',res=[],chase=null,say=null;
let bagT=10,safeT=30,safeUp=false;spawnT=5;
let evils=[],shots=[],hp=100+25*(S.hpLv||0),fireT=0,paused=false;

addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;keys[e.key.toLowerCase()]=true;if(e.key.startsWith('Arrow')||(e.key===' '&&modal.hidden))e.preventDefault()});
addEventListener('blur',()=>{keys={}});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
function setTarget(e){const r=cv.getBoundingClientRect();target={x:(e.clientX-r.left-cv.clientLeft)*W/cv.clientWidth,y:(e.clientY-r.top-cv.clientTop)*H/cv.clientHeight}}
cv.addEventListener('pointerdown',e=>{if(paused)return;cv.setPointerCapture(e.pointerId);setTarget(e);
  if(mode==='village'){const ev=evils.find(e=>Math.hypot(e.x-target.x,e.y-target.y)<40);if(ev){shoot(ev.x,ev.y);target=null;chase=null;return}const h=res.find(r=>Math.hypot(r.x-target.x,r.y-target.y)<30);if(h){chase=h;target=null}else chase=null}});
cv.addEventListener('pointermove',e=>{if(target)setTarget(e)});
cv.addEventListener('pointerup',()=>{target=null});
cv.addEventListener('pointercancel',()=>{target=null});

function spawn(kind){
  const safe=kind==='safe',gold=kind===true;
  if(!safe&&coins.length>=(S.frenzyLeft>0?70:25))return;
  if(safe)safeUp=true;
  coins.push({x:40+Math.random()*(W-80),y:40+Math.random()*(H-80),v:safe?15:gold?5:1,gold,safe,t:0});
}
spawn(false);spawn(false);spawn(true);spawn('safe');
function pop(x,y,txt){pops.push({x,y,txt,t:0})}

function update(dt){
  const sp=230; let ax=0,ay=0;
  if(keys.arrowleft||keys.a)ax-=1; if(keys.arrowright||keys.d)ax+=1;
  if(keys.arrowup||keys.w)ay-=1; if(keys.arrowdown||keys.s)ay+=1;
  let tg=target;
  if(mode==='village'&&chase){if(Math.hypot(chase.x-P.x,chase.y-P.y)<45){talk(chase);chase=null;tg=null}else tg={x:chase.x,y:chase.y}}
  if(tg){const dx=tg.x-P.x,dy=tg.y-P.y,d=Math.hypot(dx,dy);if(d>6){ax=dx/d;ay=dy/d}}
  const l=Math.hypot(ax,ay)||1;
  P.x+=ax/l*(ax||ay?sp:0)*dt; P.y+=ay/l*(ax||ay?sp:0)*dt;
  {const b=mode==='village'?vb():{x0:20,x1:W-20,y0:20,y1:H-20};P.x=Math.max(b.x0,Math.min(b.x1,P.x));P.y=Math.max(b.y0,Math.min(b.y1,P.y))}
  if(S.earned>=S.nextEvil){S.nextEvil+=10000;S.evilCount++;toast('😈 An evil toilet invaded your village! Go fight it!')}
  UNL.forEach(u=>{if(!S.unl[u.k]&&u.cur()>=u.goal){S.unl[u.k]=1;toast(u.t+' unlocked! '+u.perk)}});
  S.dayT-=dt;if(S.dayT<=0){S.dayT=300;S.night=!S.night;toast(S.night?'🌙 Night has fallen...':'☀️ A new day begins!')}
  {const tg=S.night?1:0,df=tg-nightMix;nightMix+=Math.sign(df)*Math.min(Math.abs(df),dt/3)}
  if(S.frenzyLeft>0){S.frenzyLeft-=dt;if(S.frenzyLeft<=0){S.frenzyLeft=0;toast('Frenzy over! Next one in 15 minutes.')}}
  else{S.frenzyT-=dt;if(S.frenzyT<=0){S.frenzyT=900;S.frenzyLeft=30;spawnT=0;bagT=0;toast('🔥 COIN FRENZY! Coins x2 for 30 seconds!')}}
  const fz=S.frenzyLeft>0;
  spawnT-=dt;bagT-=dt;
  if(spawnT<=0){spawn(false);spawnT=fz?0.3:(S.unl.slayer?2.5:5)}
  if(bagT<=0){spawn(true);bagT=fz?1.5:10}
  if(!safeUp){safeT-=dt;if(safeT<=0){safeT=5;if(Math.random()<(S.unl.kingdom?0.4:0.17))spawn('safe')}}
  if(mode!=='field'){wander(dt);fight(dt)}
  const reach=26+S.magnet*14,m=fz?2:1;
  if(mode==='field')coins=coins.filter(c=>{
    c.t+=dt;
    const d=Math.hypot(c.x-P.x,c.y-P.y);
    if(S.magnet&&d<reach*2.2){c.x+=(P.x-c.x)*dt*3;c.y+=(P.y-c.y)*dt*3}
    if(d<reach){const val=c.v*m;S.coins+=val;S.earned+=val;burst(c.x,c.y,c.safe||c.gold?'#ffd21f':'#ffe680',c.safe?18:8);pop(c.x,c.y,'+'+val);if(c.safe){safeUp=false;safeT=5}return false}
    return true;
  });
  frac+=rate()*m*dt; if(frac>=1){const w=Math.floor(frac);S.coins+=w;S.earned+=w;frac-=w}
  pops.forEach(p=>p.t+=dt); pops=pops.filter(p=>p.t<0.8);
  sparks.forEach(p=>{p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=160*dt});sparks=sparks.filter(p=>p.t<0.5);aT+=dt;
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);drawBackground();
  ctx.textAlign='center';ctx.textBaseline='middle';
  if(mode==='village'){drawVillage();return}
  coins.forEach(c=>{
    const b=Math.sin(c.t*5)*3;shadow(c.x,c.y+(c.safe?22:15),c.safe?22:c.gold?11:8);
    if(c.safe){ctx.fillStyle='#5b6670';ctx.fillRect(c.x-22,c.y-20+b,44,40);ctx.fillStyle='#8d99a3';ctx.fillRect(c.x-18,c.y-16+b,36,32);ctx.fillStyle='#f2c230';ctx.beginPath();ctx.arc(c.x,c.y+b,10,0,7);ctx.fill();ctx.fillStyle='#222';ctx.font='bold 12px sans-serif';ctx.fillText('15',c.x,c.y+b+1);return}
    drawCoin(c.gold?'bag':'coin',c.x,c.y+b);
  });
  drawSparks();
  if(S.magnet){ctx.strokeStyle='rgba(42,143,214,.35)';ctx.setLineDash([5,5]);ctx.beginPath();ctx.arc(P.x,P.y,26+S.magnet*14,0,7);ctx.stroke();ctx.setLineDash([])}
  const bob=isMoving()?Math.abs(Math.sin(aT*11))*5:0;shadow(P.x,P.y+19,16);ctx.save();ctx.translate(P.x,P.y-bob);ctx.rotate(Math.sin(aT*11)*0.035*(isMoving()?1:0));drawToilet(0,0,1.05,{me:1});ctx.restore();
  ctx.font='bold 18px sans-serif';ctx.fillStyle='#e8a800';
  pops.forEach(p=>{ctx.globalAlpha=1-p.t/0.8;ctx.fillText(p.txt,p.x,p.y-20-p.t*40)});
  ctx.globalAlpha=1;
}
const PX=W-100,PY=112,HZ=56;
const isl=()=>35-7*S.island;
const vb=()=>{const m=isl();return{x0:m+16,x1:W-m-16,y0:HZ+8,y1:H-m-14}};
const rp=()=>{const b=vb(),y0=Math.max(b.y0,110);return{x:b.x0+Math.random()*(b.x1-b.x0),y:y0+Math.random()*(b.y1-y0)}};
const SPR={};
function offscreen(w,h){const c=document.createElement('canvas');c.width=Math.ceil(w*DPR);c.height=Math.ceil(h*DPR);return c}
function withCtx(c,fn){const old=ctx;ctx=c.getContext('2d');ctx.setTransform(DPR,0,0,DPR,0,0);ctx.textAlign='center';ctx.textBaseline='middle';try{fn()}finally{ctx=old}}
function emo(e,x,y,size){size=Math.round(size);const k=e+size;let c=SPR[k];if(!c){const n=Math.ceil(size*1.5);c=SPR[k]=offscreen(n,n);c.n=n;withCtx(c,()=>{ctx.font=size+'px sans-serif';ctx.fillText(e,n/2,n/2)})}ctx.drawImage(c,x-c.n/2,y-c.n/2,c.n,c.n)}
function drawToilet(x,y,s,o){o=o||{};const k='t'+s+(o.evil?'e':o.me?'m'+(S.wear||''):'c'+((o.c||0)%5));let c=SPR[k];
  if(!c){c=SPR[k]=offscreen(Math.ceil(64*s),Math.ceil(76*s));c.w=Math.ceil(64*s);c.h=Math.ceil(76*s);c.ox=32*s;c.oy=50*s;withCtx(c,()=>paintToilet(c.ox,c.oy,s,o))}
  ctx.drawImage(c,x-c.ox,y-c.oy,c.w,c.h)}
function drawFrenzy(){
  const w=Math.sin(aT*8);ctx.save();
  ctx.fillStyle='rgba(255,200,0,'+(.06+.05*w)+')';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,170,0,'+(.55+.3*w)+')';ctx.lineWidth=6;ctx.strokeRect(3,3,W-6,H-6);
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 16px sans-serif';
  const t='🔥 FRENZY x2 · '+Math.ceil(S.frenzyLeft)+'s';
  ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.strokeText(t,W/2,18);ctx.fillStyle='#b34700';ctx.fillText(t,W/2,18);
  ctx.restore();
}
let fzTxt='';
function updateFrenzy(){
  const on=S.frenzyLeft>0,t=Math.ceil(on?S.frenzyLeft:S.frenzyT);
  const txt=on?'🔥 FRENZY! Coins x2 — '+t+'s left':'⏳ Next frenzy in: '+Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
  if(txt===fzTxt)return;fzTxt=txt;
  const el=document.getElementById('frenzy');el.textContent=txt;el.classList.toggle('on',on);
}
function paintCoin(kind,x,y){
  ctx.save();ctx.translate(x,y);ctx.lineJoin='round';ctx.globalAlpha=1;
  if(kind==='bag'){
    ctx.beginPath();ctx.moveTo(-5,-10);ctx.bezierCurveTo(-19,-2,-17,14,0,14);ctx.bezierCurveTo(17,14,19,-2,5,-10);ctx.closePath();
    ctx.fillStyle='#e0a93c';ctx.fill();ctx.strokeStyle='#5e3b0f';ctx.lineWidth=2.5;ctx.stroke();
    ctx.fillStyle='#8a5a1c';ctx.fillRect(-6,-14,12,6);ctx.strokeRect(-6,-14,12,6);
    ctx.fillStyle='#5e3b0f';ctx.font='bold 17px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('$',0,3);
  }else{
    ctx.beginPath();ctx.arc(0,0,12,0,6.3);ctx.fillStyle='#ffcf2e';ctx.fill();ctx.strokeStyle='#8a5a00';ctx.lineWidth=2.5;ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,8,0,6.3);ctx.strokeStyle='#d99a00';ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle='#8a5a00';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('$',0,1);
    ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(0,0,10,3.6,4.5);ctx.stroke();
  }
  ctx.restore();
}
function drawCoin(kind,x,y){let c=SPR[kind];if(!c){c=SPR[kind]=offscreen(40,40);withCtx(c,()=>paintCoin(kind,20,20))}ctx.drawImage(c,x-20,y-20,40,40)}
let dnTxt='';
function updateDay(){const t=Math.ceil(S.dayT),txt=(S.night?'🌙 Night — day breaks in ':'☀️ Day — night falls in ')+Math.floor(t/60)+':'+String(t%60).padStart(2,'0');if(txt===dnTxt)return;dnTxt=txt;document.getElementById('daynight').textContent=txt}
let aT=0,sparks=[],nightMix=S.night?1:0;
const isMoving=()=>!!(keys.a||keys.d||keys.w||keys.s||keys.arrowleft||keys.arrowright||keys.arrowup||keys.arrowdown||target||(mode==='village'&&chase));
function shadow(x,y,r){ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(x,y,r,r*.32,0,0,6.3);ctx.fill()}
function burst(x,y,col,n){n=n||8;for(let i=0;i<n;i++){const a=Math.random()*6.28,s=40+Math.random()*80;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,t:0,c:col})}}
function drawSparks(){sparks.forEach(p=>{ctx.globalAlpha=Math.max(0,1-p.t/0.5);ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,4,4)});ctx.globalAlpha=1}

    out.push({t:u.t+(on?' ✓':' 🔒'),s:on?'Unlocked · '+u.perk:'Locked · '+u.need+' ('+cur.toLocaleString()+'/'+u.goal+')',off:true,info:true,done:on,need:0,go(){}});
    if(u.k==='town'&&on){
      const l=S.island,mx=l>=5,c=islCost(l);
      out.push({t:'🏝️ Expand Island (lv '+l+'/5)',s:mx?'MAX SIZE':'🪙 '+c.toLocaleString()+' · bigger island, +10 villagers, +1 building slot per type',off:mx||S.coins<c,need:c,go:()=>{S.coins-=c;S.island++;toast('🏝️ Your island grew!')}});
    }
  });
  return out;
}
const LB={db:null,user:null,id:null,rows:[],names:{},ok:null,readOnly:false,sub:'earned',last:'',lastT:0,writing:false};
const LBTABS=[['earned','🪙 Coins earned'],['kills','😈 Evil toilets beaten'],['pop','🚽 Villagers']];
let LBEL=null;
function boardEl(){
  if(LBEL)return LBEL;
  const d=LBEL=document.createElement('div');d.className='lb';
  const tabs=document.createElement('div');tabs.className='lbtabs';
  LBTABS.forEach(t=>{const b=document.createElement('button');b.textContent=t[1];b.dataset.s=t[0];b.onclick=()=>{LB.sub=t[0];paintBoard()};tabs.appendChild(b)});
  const lab=document.createElement('label');lab.className='lbnick';lab.textContent='Your name on the board: ';
  const inp=document.createElement('input');inp.maxLength=16;inp.placeholder='Anonymous toilet';inp.value=S.nick||'';
  inp.onchange=()=>{S.nick=inp.value.trim().slice(0,16);lbPush(true);paintBoard()};
  lab.appendChild(inp);
  const note=document.createElement('div');note.className='hint';note.id='lbnote';
  const list=document.createElement('div');list.id='lblist';list.style.display='grid';list.style.gap='6px';
  d.append(tabs,lab,note,list);
  return d;
}
function renderBoard(){
  if(modal.hidden)return;
  if(otherSig!=='board'){otherSig='board';shopEl.innerHTML='';shopEl.appendChild(boardEl())}
  paintBoard();
}
function paintBoard(){
  if(!LBEL)return;
  LBEL.querySelectorAll('.lbtabs button').forEach(b=>b.classList.toggle('on',b.dataset.s===LB.sub));
  let msg;
  if(LB.ok===null)msg='Connecting to the leaderboard...';
  else if(!LB.ok)msg='The leaderboard is not available here. Open the game from its claude.ai link while signed in.';
  else if(!LB.id)msg='Sign in to claude.ai to get on the board.';
  else if(LB.readOnly)msg='You can see the board but not post a score. Ask the owner for Contributor access.';
  else msg='Your score is sent about every 30 seconds.';
  LBEL.querySelector('#lbnote').textContent=msg;
  const rows=LB.rows.filter(r=>r.id!==LB.id);
  if(LB.id&&!LB.readOnly&&S.earned>0)rows.push({id:LB.id,earned:Math.floor(S.earned),kills:S.kills,pop:S.own.person||0,nick:S.nick||'',rk:rankMask(),me:true});
  else{const m=LB.rows.find(r=>r.id===LB.id);if(m)rows.push(Object.assign({},m,{me:true}))}
  const k=LB.sub;
  rows.sort((a,b)=>(b[k]||0)-(a[k]||0)||(b.earned||0)-(a.earned||0));
  const list=LBEL.querySelector('#lblist');list.textContent='';
  const add=(r,i)=>{
    const row=document.createElement('div');row.className='lbrow'+(r.me?' me':'');
    const rk=document.createElement('span');rk.className='r';rk.textContent=['🥇','🥈','🥉'][i]||(i+1)+'.';
    const nm=document.createElement('span');nm.className='n';
    nm.textContent=((r.nick||LB.names[r.id]||'').trim()||'Anonymous toilet')+(r.me?' (you)':'');
    const v=document.createElement('span');v.className='v';v.textContent=(r[k]||0).toLocaleString();
    row.append(rk,nm);const rkv=(r.rk|0)&7;RANKS.forEach(x=>{if(rkv&x[0]){const pl=document.createElement('span');pl.className='pill';pl.textContent=x[1];row.append(pl)}});row.append(v);list.appendChild(row);
  };
  rows.slice(0,10).forEach(add);
  const mi=rows.findIndex(r=>r.me);
  if(mi>=10){const g=document.createElement('div');g.className='hint';g.textContent='...';list.appendChild(g);add(rows[mi],mi)}
  if(!rows.length){const g=document.createElement('div');g.className='hint';g.textContent='No scores yet. Be the first!';list.appendChild(g)}
}
async function lbNames(){
  try{if(!LB.user||!LB.user.profiles)return;const ids=LB.rows.map(r=>r.id);if(!ids.length)return;const ps=await LB.user.profiles(ids);ids.forEach(i=>{LB.names[i]=(ps[i]&&ps[i].name)||''});paintBoard()}catch(e){}
}
async function lbPush(force){
  if(!LB.db||!LB.id||LB.readOnly||LB.writing||!(S.earned>0))return;
  const d={earned:Math.floor(S.earned),kills:S.kills,pop:S.own.person||0,nick:S.nick||'',rk:rankMask()};
  const key=JSON.stringify(d);
  if(key===LB.last)return;
  if(force!==true&&Date.now()-LB.lastT<30000)return;
  LB.writing=true;
  try{await LB.db.collection('lb').doc(LB.id).set(d);LB.last=key}
  catch(e){if(e&&e.code==='invalid_argument')LB.readOnly=true}
  LB.lastT=Date.now();LB.writing=false;paintBoard();
}
async function lbInit(){
  try{
    const cl=window.claude;
    if(!cl||!cl.use){LB.ok=false;paintBoard();return}
    const db=await cl.use('db'),user=await cl.use('user');
    if(!db){LB.ok=false;paintBoard();return}
    LB.db=db;LB.user=user;
    LB.id=user&&user.id?await user.id():null;
    LB.ok=true;paintBoard();
    db.collection('lb').limit(200).onSnapshot(snap=>{
      LB.rows=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
      paintBoard();lbNames();
    },e=>{LB.ok=false;paintBoard()});
    lbPush();
  }catch(e){LB.ok=false;paintBoard()}
}
function nearest(){let b=null,bd=60;res.forEach(r=>{const d=Math.hypot(r.x-P.x,r.y-P.y);if(d<bd){bd=d;b=r}});return b}
function drawVillage(){
  const fg=nightMix>=.5?'#f0f6ff':'#14304a';
  const bl=[],vbb=vb();let j=0;
  ITEMS.forEach(it=>{if(it.id==='person')return;const n=Math.min(S.own[it.id]||0,10+S.island);for(let i=0;i<n;i++){const s=SLOTS[j*15+i];if(s)bl.push({e:it.emoji,z:it.id==='castle'?44:34,x:vbb.x0+(s.x-30)*(vbb.x1-vbb.x0)/(W-60),y:76+(s.y-76)*(vbb.y1-10-76)/(H-130)})}j++});
  bl.sort((a,b)=>a.y-b.y).forEach(b=>emo(b.e,b.x,b.y,b.z));
  const near=nearest();
  [...res].sort((a,b)=>a.y-b.y).forEach(r=>{
    const rb=r.w>0?0:Math.abs(Math.sin(aT*9+r.i))*3;shadow(r.x,r.y+14,11);drawToilet(r.x,r.y-rb,.8,{c:r.i});
    ctx.font='11px sans-serif';ctx.fillStyle=fg;ctx.fillText(r.name+(S.hearts[r.i]?' ❤'+S.hearts[r.i]:''),r.x,r.y+24);
    if(r===near)emo('💬',r.x+18,r.y-22,20);
  });
  evils.forEach(e=>{shadow(e.x,e.y+22,18);drawToilet(e.x,e.y,1.2,{evil:1});emo('😈',e.x+20,e.y-22,22);ctx.fillStyle='#555';ctx.fillRect(e.x-26,e.y-42,52,6);ctx.fillStyle='#e03030';ctx.fillRect(e.x-26,e.y-42,52*Math.max(0,e.hp)/e.max,6);if(e.hit>0)emo('💥',e.x,e.y,22);});
  const pb=isMoving()?Math.abs(Math.sin(aT*11))*5:0;shadow(P.x,P.y+19,16);drawToilet(P.x,P.y-pb,1.05,{me:1});
  if(evils.length||hp<maxHp()){emo('🔫',P.x+24,P.y+4,24);ctx.fillStyle='#555';ctx.fillRect(P.x-24,P.y-50,48,6);ctx.fillStyle='#2fb344';ctx.fillRect(P.x-24,P.y-50,48*Math.max(0,hp)/maxHp(),6)}
  shots.forEach(s=>{ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.r);emo('🪠',0,0,22);ctx.restore()});
  drawSparks();
  if(!res.length){ctx.font='15px sans-serif';ctx.fillStyle=fg;ctx.fillText('No toilet people yet. Hire some in the Shop!',W/2,H/2)}
  if(say){ctx.font='13px sans-serif';const w=Math.min(ctx.measureText(say.text).width+16,W-10),x=Math.max(w/2+5,Math.min(W-w/2-5,say.r.x)),y=Math.max(20,say.r.y-48);
    ctx.fillStyle='#fff';ctx.strokeStyle='#14304a';ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x-w/2,y-14,w,28,8);else ctx.rect(x-w/2,y-14,w,28);ctx.fill();ctx.stroke();ctx.fillStyle='#14304a';ctx.fillText(say.text,x,y,w-10)}
  ctx.font='bold 18px sans-serif';ctx.fillStyle='#e8a800';
  pops.forEach(p=>{ctx.globalAlpha=1-p.t/0.8;ctx.fillText(p.txt,p.x,p.y-20-p.t*40)});
  ctx.globalAlpha=1;
}
function setMode(m){mode=m;chase=null;target=null;keys={};say=null;pops=[];
  document.getElementById('modeBtn').textContent=m==='village'?'🪙 Coin Field':'🏘️ Village';
  document.getElementById('hint').textContent=m==='village'?'Walk around your village. Press E (or tap a toilet person) to chat. Friends tip you coins! Evil toilets? Hold F or tap them to fire plunger guns!':'Move with arrow keys / WASD, or drag on the field. Grab coins, then tap the Shop button to spend them (or press B).';
  if(m==='village'){syncRes();P.x=W/2;P.y=H-40}}
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(!paused&&modal.hidden)update(dt);draw();if(S.frenzyLeft>0)drawFrenzy();
  if(paused){ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 36px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('⏸ Paused',W/2,H/2);ctx.font='14px sans-serif';ctx.fillText('Press P or tap Resume',W/2,H/2+34)}
  requestAnimationFrame(loop);
}

const shopEl=document.getElementById('shop');
let shopSig='';let shopTab='town',otherSig='';

function renderShop(){
  const coinsN=Math.floor(S.coins);
  document.getElementById('coins').textContent=coinsN.toLocaleString();
  document.getElementById('coins2').textContent=coinsN.toLocaleString();
  document.getElementById('rate').textContent=rate().toFixed(1);
  if(shopTab!=='town'){renderOther();return}
  const sig=ITEMS.map(it=>cost(it)+':'+(S.coins>=cost(it))+':'+(S.own[it.id]||0)).join()+'|'+magCost()+(S.coins>=magCost())+S.magnet;
  if(sig===shopSig)return;shopSig=sig;
  shopEl.innerHTML='';
  ITEMS.forEach(it=>{
    const b=document.createElement('button');b.disabled=S.coins<cost(it);
    b.innerHTML='<b>'+it.emoji+' '+it.name+' ('+(S.own[it.id]||0)+')</b><span>🪙 '+cost(it).toLocaleString()+' · +'+it.inc+'/sec</span>';
    b.onclick=()=>{if(S.coins>=cost(it)){S.coins-=cost(it);S.own[it.id]=(S.own[it.id]||0)+1;renderShop();renderVillage()}};
    shopEl.appendChild(b);
  });
  const m=document.createElement('button');m.disabled=S.coins<magCost();
  m.innerHTML='<b>🧲 Coin Magnet (lv '+S.magnet+')</b><span>🪙 '+magCost().toLocaleString()+' · bigger pickup reach</span>';
  m.onclick=()=>{if(S.coins>=magCost()){S.coins-=magCost();S.magnet++;renderShop()}};
  shopEl.appendChild(m);
  
  
  
  
}
function renderVillage(){
  const v=document.getElementById('village');v.innerHTML='';
  ITEMS.forEach(it=>{
    const k=Math.min(S.own[it.id]||0,20);
    for(let i=0;i<k;i++){const e=document.createElement('i');e.textContent=it.emoji;e.style.animationDelay=(Math.random()*1.5)+'s';v.appendChild(e)}
  });
  document.getElementById('pop').textContent=S.own.person||0;
  if(!v.children.length)v.innerHTML='<span class="hint">Empty so far. Collect coins and hire your first toilet person!</span>';
}
renderShop();renderVillage();
setInterval(renderShop,250);
setInterval(updateFrenzy,250);updateFrenzy();
setInterval(updateDay,250);updateDay();
setInterval(()=>lbPush(false),15000);
lbInit();
setInterval(()=>{if(mode==='field')document.getElementById('modeBtn').textContent=S.evilCount?'🏘️ Village ⚠️ '+S.evilCount:'🏘️ Village'},250);
const modal=document.getElementById('modal');
function toggleShop(open){modal.hidden=!open;if(open){keys={};target=null;renderShop()}}
document.getElementById('openShop').onclick=()=>toggleShop(true);
document.getElementById('boardBtn').onclick=()=>{shopTab='board';shopSig='';otherSig='';syncTabs();toggleShop(true);lbPush(true)};
document.getElementById('closeShop').onclick=()=>toggleShop(false);
modal.addEventListener('click',e=>{if(e.target===modal)toggleShop(false)});
document.getElementById('modeBtn').onclick=()=>setMode(mode==='field'?'village':'field');
function syncTabs(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===shopTab));document.getElementById('mtitle').textContent=shopTab==='board'?'🏆 Leaderboard':'🛒 Shop'}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{shopTab=b.dataset.t;shopSig='';otherSig='';syncTabs();renderShop()});
function togglePause(){paused=!paused;keys={};target=null;chase=null;document.getElementById('pauseBtn').textContent=paused?'▶ Resume':'⏸ Pause'}
document.getElementById('pauseBtn').onclick=togglePause;
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;const k=e.key.toLowerCase();if(!modal.hidden)return;if(k==='p'){togglePause();return}if(paused)return;if(k==='v')setMode(mode==='field'?'village':'field');else if((k==='e'||k===' ')&&mode==='village'){const r=nearest();if(r)talk(r)}});
addEventListener('keydown',e=>{if(e.key==='Escape')toggleShop(false);else if(e.key.toLowerCase()==='b'&&!(e.target&&e.target.tagName==='INPUT'))toggleShop(modal.hidden)});
const save=()=>{try{localStorage.setItem('toiletVillage',JSON.stringify(S))}catch(e){}};
setInterval(save,2000);
addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button');if(b)b.blur()});
cv.addEventListener('contextmenu',e=>e.preventDefault());
requestAnimationFrame(loop);
</script>
